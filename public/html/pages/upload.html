<!-- Upload Page -->
<div class="page active">
    <div class="upload-container">
        <div class="upload-header">
            <div class="upload-icon-wrapper">
                <div class="upload-icon">
                    <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <div class="upload-glow"></div>
            </div>
            <h1 data-i18n="pages.upload.title">Tải Lên Tệp</h1>
            <p data-i18n="pages.upload.subtitle">Chia sẻ tệp của bạn một cách an toàn và nhanh chóng</p>
        </div>
        
        <div class="upload-main">
            <div class="upload-drop-zone" id="dropZone" aria-label="Kéo & thả tệp vào đây" data-i18n="pages.upload.dropZone.label" data-i18n-attr="aria-label">
                <div class="drop-zone-content">
                    <div class="upload-illustration">
                        <div class="cloud-icon">
                            <i class="fas fa-cloud"></i>
                        </div>
                        <div class="upload-arrow">
                            <i class="fas fa-arrow-up"></i>
                        </div>
                    </div>
                    <h3 data-i18n="pages.upload.dropZone.title">Kéo & thả tệp vào đây</h3>
                    <p data-i18n="pages.upload.dropZone.description" data-i18n-html="true">hoặc <span class="highlight">chọn tệp từ máy tính</span></p>
                    <div class="upload-info">
                        <div class="info-item">
                            <i class="fas fa-files"></i>
                            <span data-i18n="pages.upload.info.maxFiles">Tối đa 5 tệp</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-weight-hanging"></i>
                            <span data-i18n="pages.upload.info.maxSize">2GB mỗi tệp</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-shield-alt"></i>
                            <span data-i18n="pages.upload.info.security">Bảo mật cao</span>
                        </div>
                    </div>
                </div>
                <input type="file" id="fileInput" multiple accept="*/*" style="display: none;">
            </div>
            
            <div class="upload-actions">
                <button class="btn-upload-primary">
                    <i class="fas fa-plus"></i>
                    <span data-i18n="pages.upload.selectButton">Chọn Tệp</span>
                </button>

            </div>
        </div>
        

    </div>
</div>
