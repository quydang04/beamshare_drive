<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeamShare - Quên mật khẩu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/png" href="/public/img/favicon.png">
    <link rel="stylesheet" href="/public/css/base.css">
    <link rel="stylesheet" href="/public/css/theme.css">
    <link rel="stylesheet" href="/public/pages/sso/css/auth.css">
    <script src="/public/pages/sso/js/auth-theme.js"></script>
    <!-- Security: Prevent credentials from appearing in URL if JS fails -->
    <script>
        document.addEventListener('submit', function(e) {
            var form = e.target;
            if (form && form.classList && form.classList.contains('auth-form')) {
                e.preventDefault();
                if (typeof window.handleAuthFormSubmit === 'function') {
                    window.handleAuthFormSubmit(form);
                }
            }
        }, true);
    </script>
</head>
<body>
    <a href="/" class="back-home">
        <i class="fas fa-arrow-left"></i>
        <span data-i18n="common.backHome">Trang chủ</span>
    </a>
    <div class="lang-toggle-wrapper" id="langWrapper">
        <button class="lang-toggle" id="langToggle" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Chuyển ngôn ngữ">
            <i class="fas fa-globe" aria-hidden="true"></i>
            <span class="lang-toggle__label" id="langLabel">VI</span>
            <i class="fas fa-caret-down lang-toggle__caret" aria-hidden="true"></i>
        </button>
        <div class="lang-menu" id="langMenu" role="menu">
            <button class="lang-option" type="button" data-lang="vi" role="menuitemradio" aria-checked="true">
                <span>🇻🇳</span>
                <span>Tiếng Việt</span>
            </button>
            <button class="lang-option" type="button" data-lang="en" role="menuitemradio" aria-checked="false">
                <span>🇺🇸</span>
                <span>English</span>
            </button>
        </div>
    </div>
    <div class="theme-toggle-wrapper" id="themeWrapper">
        <button class="theme-toggle" id="themeToggle" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Chuyển giao diện">
            <i class="fas fa-sun theme-toggle__icon" id="themeIcon" aria-hidden="true"></i>
            <span class="theme-toggle__label" id="themeLabel" data-i18n="theme.light">Sáng</span>
            <i class="fas fa-caret-down theme-toggle__caret" aria-hidden="true"></i>
        </button>
        <div class="theme-menu" id="themeMenu" role="menu">
            <button class="theme-option" type="button" data-theme-option="light" role="menuitemradio" aria-checked="false">
                <i class="fas fa-sun"></i>
                <span data-i18n="theme.light">Sáng</span>
            </button>
            <button class="theme-option" type="button" data-theme-option="dark" role="menuitemradio" aria-checked="false">
                <i class="fas fa-moon"></i>
                <span data-i18n="theme.dark">Tối</span>
            </button>
            <button class="theme-option" type="button" data-theme-option="system" role="menuitemradio" aria-checked="false">
                <i class="fas fa-desktop"></i>
                <span data-i18n="theme.system">Hệ thống</span>
            </button>
        </div>
    </div>
    <div class="auth-wrapper">
        <div class="auth-card" data-page="forgot">
            <div class="auth-logo">
                <img src="/public/img/favicon.png" alt="BeamShare Logo" class="auth-logo-img">
                <span>BeamShare</span>
            </div>
            <div class="auth-header">
                <h1 data-i18n="auth.forgotPassword.title">Quên mật khẩu</h1>
                <p data-i18n="auth.forgotPassword.subtitle">Nhập email để nhận hướng dẫn đặt lại mật khẩu.</p>
            </div>
            <form class="auth-form" id="forgot-form" data-form-type="forgot" method="POST" action="/api/auth/forgot-password" autocomplete="off">
                <div class="auth-alert" role="alert"></div>
                <div class="form-field">
                    <label for="forgot-email" data-i18n="auth.forgotPassword.emailLabel">Email đăng ký</label>
                    <input type="email" id="forgot-email" name="email" data-i18n-placeholder="auth.forgotPassword.emailPlaceholder" placeholder="name@email.com" required>
                </div>
                <div class="auth-actions">
                    <button type="submit" class="btn-primary" data-i18n="auth.forgotPassword.submit">Gửi hướng dẫn</button>
                </div>
            </form>
            <div class="auth-footer">
                <a href="/auth/login" data-i18n="auth.forgotPassword.backToLogin">Quay lại đăng nhập</a>
            </div>
        </div>
    </div>
    <script src="/public/pages/sso/js/auth-translate.js"></script>
    <script src="/public/pages/sso/js/auth-forms.js" defer></script>
</body>
</html>
