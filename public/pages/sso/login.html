<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeamShare - Đăng nhập</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/png" href="/public/img/favicon.png">
    <link rel="stylesheet" href="/public/css/base.css">
    <link rel="stylesheet" href="/public/css/theme.css">
    <link rel="stylesheet" href="/public/pages/sso/css/auth.css">
    <script src="/public/pages/sso/js/auth-theme.js"></script>
</head>
<body>
    <a href="/" class="back-home">
        <i class="fas fa-arrow-left"></i>
        Trang chủ
    </a>
    <div class="theme-toggle-wrapper" id="themeWrapper">
        <button class="theme-toggle" id="themeToggle" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Chuyển giao diện">
            <i class="fas fa-sun theme-toggle__icon" id="themeIcon" aria-hidden="true"></i>
            <span class="theme-toggle__label" id="themeLabel">Sáng</span>
            <i class="fas fa-caret-down theme-toggle__caret" aria-hidden="true"></i>
        </button>
        <div class="theme-menu" id="themeMenu" role="menu">
            <button class="theme-option" type="button" data-theme-option="light" role="menuitemradio" aria-checked="false">
                <i class="fas fa-sun"></i>
                <span>Sáng</span>
            </button>
            <button class="theme-option" type="button" data-theme-option="dark" role="menuitemradio" aria-checked="false">
                <i class="fas fa-moon"></i>
                <span>Tối</span>
            </button>
            <button class="theme-option" type="button" data-theme-option="system" role="menuitemradio" aria-checked="false">
                <i class="fas fa-desktop"></i>
                <span>Hệ thống</span>
            </button>
        </div>
    </div>
    <div class="auth-wrapper">
        <div class="auth-card" data-page="login">
            <div class="auth-logo">
                <img src="/public/img/favicon.png" alt="BeamShare Logo" class="auth-logo-img">
                <span>BeamShare</span>
            </div>
            <div class="auth-header">
                <h1>Chào mừng trở lại</h1>
                <p>Đăng nhập để quản lý và chia sẻ tệp tin của bạn.</p>
            </div>
            <form class="auth-form" id="login-form" data-form-type="login">
                <div class="auth-alert" role="alert"></div>
                <div class="form-field">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" placeholder="name@email.com" autocomplete="username" required>
                </div>
                <div class="form-field password-field">
                    <label for="login-password">Mật khẩu</label>
                    <input type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password" required minlength="6">
                    <button type="button" class="password-toggle" aria-label="Hiển thị mật khẩu">
                        <i class="fas fa-eye"></i>
                        <i class="fas fa-eye-slash"></i>
                    </button>
                </div>
                <div class="form-support">
                    <label>
                        <input type="checkbox" name="remember" checked>
                        Ghi nhớ tôi
                    </label>
                    <a href="/auth/forgot-password">Quên mật khẩu?</a>
                </div>
                <div class="auth-actions">
                    <button type="submit" class="btn-primary">Đăng nhập</button>
                </div>
            </form>
            <div class="auth-footer">
                Chưa có tài khoản? <a href="/auth/register">Đăng ký ngay</a>
            </div>
        </div>
    </div>
    <script src="/public/pages/sso/js/auth-forms.js" defer></script>
</body>
</html>
